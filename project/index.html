<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- SignUp form -->
    <div>
        <h1>Sign Up</h1>
        Name:<input type="text" placeholder="Enter your name" id="s-name"><br>
        Email:<input type="email" placeholder="Enter your email" id="s-email"><br>
        Password:<input type="password" placeholder="Enter your password" id="s-pass"><br>
        <button onclick="signUp()">SignUp</button>
    </div>
    <!-- Login Form -->
      <div>
        <h1>Login</h1>
        Email:<input type="email" placeholder="Enter your email" id="l-email"><br>
        Password:<input type="password" placeholder="Enter your password" id="l-pass"><br>
        <button onclick="login()">Login</button>
    </div>
    
</body>
<script src="app.js"></script>
</html>
